<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Kanban · G4</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23031a26%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Georgia,serif%27 font-weight=%27700%27 font-size=%2716%27 text-anchor=%27middle%27 fill=%27%23b9915b%27%3EG4%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav-row">
      <a class="brand" href="#/pipeline" aria-label="Lead Kanban, início">
        <span class="brand-mark">G4</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-name">Lead Kanban</span>
      </a>
      <nav class="tabs" aria-label="Seções">
        <a href="#/pipeline" data-view="pipeline">Pipeline</a>
        <a href="#/dashboard" data-view="dashboard">Dashboard</a>
      </nav>
      <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters">
        Filtros <span id="filters-count"></span>
      </button>
      <form class="nav-filters" id="filters" autocomplete="off" onsubmit="return false">
        <label class="nav-field"><span class="sr-only">Regional</span><select id="f-region"></select></label>
        <label class="nav-field"><span class="sr-only">Manager</span><select id="f-manager"></select></label>
        <label class="nav-field"><span class="sr-only">Vendedor</span><select id="f-agent"></select></label>
        <label class="nav-field nav-search">
          <span class="sr-only">Buscar</span>
          <svg aria-hidden="true" viewBox="0 0 20 20" width="15" height="15"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="f-search" type="search" placeholder="Buscar ID, produto, conta ou vendedor">
        </label>
        <button type="button" class="nav-clear" id="f-clear" title="Limpar filtros">Limpar</button>
      </form>
      <button type="button" class="help-btn" id="open-help" aria-label="Tutorial de uso e regras do sistema" title="Tutorial de uso e regras (tecla ?)">?</button>
    </div>
  </header>

  <main id="view-pipeline" class="view">
    <div class="page-head">
      <div>
        <h1>Pipeline</h1>
        <p class="page-sub" id="pipeline-summary"></p>
      </div>
      <div class="page-tools">
        <label class="tool-field">
          <span>Ordenar</span>
          <select id="f-sort">
            <option value="recommended">Recomendada</option>
            <option value="recent">Negociação mais recente</option>
            <option value="oldest">Mais tempo em negociação</option>
          </select>
        </label>
        <label class="toggle">
          <input id="f-missing" type="checkbox">
          <span class="toggle-track" aria-hidden="true"></span>
          <span>Só contas pendentes</span>
        </label>
        <button type="button" class="ghost-btn" id="export-pipeline">Exportar CSV</button>
      </div>
    </div>
    <section class="guide" id="pipeline-guide" aria-label="Como usar o quadro" hidden></section>
    <div class="board" id="board" aria-busy="true"><div class="loading">Carregando oportunidades…</div></div>
  </main>

  <main id="view-dashboard" class="view" hidden>
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <p class="page-sub" id="dashboard-summary"></p>
      </div>
      <div class="page-tools">
        <div class="segmented" role="radiogroup" aria-label="Agrupar por" id="group-by">
          <button type="button" role="radio" data-group="region">Regional</button>
          <button type="button" role="radio" data-group="manager">Manager</button>
          <button type="button" role="radio" data-group="agent">Vendedor</button>
        </div>
        <button type="button" class="ghost-btn" id="export-dashboard">Exportar CSV</button>
      </div>
    </div>
    <div id="dashboard"></div>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <dialog class="modal" id="deal-modal" aria-labelledby="deal-title">
    <div class="modal-shell" id="deal-content"></div>
  </dialog>

  <dialog class="modal modal-wide" id="help-modal" aria-labelledby="help-title">
    <div class="modal-shell" id="help-content"></div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
